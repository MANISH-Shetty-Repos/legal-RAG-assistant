version: '3.8'

services:
  rag-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rag-assistant-app
    ports:
      - "8501:8501"
      - "8000:8000"
    volumes:
      - ./chroma_db:/app/chroma_db
      - ./data:/app/data
      - ./logs:/app/logs
      - ./evaluation/reports:/app/evaluation/reports
    env_file:
      - .env
    environment:
      - CHROMA_PERSIST_DIR=/app/chroma_db
      - LOG_DIR=/app/logs
      - DATA_DIR=/app/data
    restart: always
